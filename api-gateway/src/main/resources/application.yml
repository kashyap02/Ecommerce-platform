server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # User Service — auth endpoints (public)
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        # User Service — profile endpoints (protected)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        # Product Service
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**

        # Order Service
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

services:
  rate-limiter:
    url: http://localhost:8085