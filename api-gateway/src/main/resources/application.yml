server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: user-service-auth
          uri: http://user-service:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**

        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/orders/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

services:
  rate-limiter:
    url: http://rate-limiter-service:8085